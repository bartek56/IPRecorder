version: 2.1

jobs:
  test:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: Init git submodules
          command: |
            git submodule update --init --recursive

      - run:
          name: Install system build deps for GSMEngine
          command: |
            sudo apt-get update
            sudo apt-get install -y cmake build-essential

      - run:
          name: Install GSMEngine from local sibling project
          command: |
            python -m pip install --upgrade pip
            cd GSMEngine
            python -m pip install -e .

      - run:
          name: Install Python dependencies
          command: |
            python -m pip install pytest pytest-cov
            python -m pip install -r MonitoringManager/requirements.txt

      - run:
          name: Install MonitoringManager package
          command: |
            PYTHONPATH=. python -m pip install -e MonitoringManager || true

      - run:
          name: Run tests with JUnit output
          command: |
            mkdir -p test-results
            PYTHONPATH=. pytest MonitoringManager/tests -q --junitxml=test-results/junit.xml

      - run:
          name: Run tests with coverage
          command: |
            mkdir -p coverage-results
            PYTHONPATH=. pytest MonitoringManager/tests --cov=MonitoringManager --cov-report=term-missing --cov-report=xml:coverage-results/coverage.xml --cov-report=html:coverage-results/html

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: |
            test-results
            coverage-results

workflows:
  version: 2
  test_workflow:
    jobs:
      - test
