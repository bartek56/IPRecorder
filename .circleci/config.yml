version: 2.1

jobs:
 
  GSMApp:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - checkout
    
      - run:
          name: Install system build deps for GSMApp
          command: |
            sudo apt-get update
            sudo apt-get install -y cmake python3-dev

      - run:
          name: Build GSMApp by cmake      - checkout
          command: |
            git submodules update --init --recursive
            cd GSMEngine
            cmake -S . -B build
            cmake --build build
         
      - run:
          name: Run UTs
          command: |
            cd GSMEngine/build
            ctest --output-on-failure || true
            # Produce GoogleTest XMLs for each test executable
            mkdir -p ../test-results/gsmengine
            for exe in $(find . -type f -executable -name '*Tests*' -print); do
              name=$(basename "$exe")
              echo "Running $exe -> ../test-results/gsmengine/${name}.xml"
              ./$exe --gtest_output=xml:../test-results/gsmengine/${name}.xml || true
            done

      - run:
          name: Prepare artifacts directory
          command: |
            mkdir -p ~/project/artifacts/gsmengine
            # copy test results and build outputs if present
            if [ -d GSMEngine/test-results ]; then
              cp -r GSMEngine/test-results ~/project/artifacts/gsmengine/ || true
            fi
            if [ -d GSMEngine/build ]; then
              cp -r GSMEngine/build ~/project/artifacts/gsmengine/build || true
            fi

      - store_test_results:
          path: artifacts/gsmengine/test-results

      - store_artifacts:
          path: artifacts/gsmengine

  GSMEnginelib:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - checkout
      
      - run:
          name: Install system build deps for GSMEngine
          command: |
            sudo apt-get update
            sudo apt-get install -y cmake build-essential

      - run:
          name: Build GSMEngine by pip
          command: |
            cd GSMEngine
            python -m pip install -e .

  MonitoringManager:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: Install Python dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r MonitoringManager/requirements_tests.txt

      - run:
          name: Run tests with JUnit output
          command: |
            mkdir -p test-results
            PYTHONPATH=. pytest MonitoringManager/tests -q --junitxml=test-results/junit.xml

      - run:
          name: Run tests with coverage
          command: |
            mkdir -p coverage-results
            PYTHONPATH=. pytest MonitoringManager/tests --cov=MonitoringManager --cov-report=term-missing --cov-report=xml:coverage-results/coverage.xml --cov-report=html:coverage-results/html

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: test-results

      - store_artifacts:
          path: coverage-results

workflows:
  version: 2
  test_workflow:
    jobs:
      - GSMEnginelib
      - GSMApp
      - MonitoringManager
