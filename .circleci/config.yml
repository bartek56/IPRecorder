version: 2.1

jobs:
  prepare:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - checkout

      - run:
          name: Init git submodules
          command: |
            git submodule update --init --recursive

      - persist_to_workspace:
          root: .
          paths:
            - .
  
  build_gsm_app:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: ~/project

      - run:
          name: Install system build deps for GSMEngine
          command: |
            sudo apt-get update
            sudo apt-get install -y cmake python3-dev

      - run:
          name: Build GSMApp by cmake
          command: |
            cd GSMEngine
            cmake -S . -B build
            cmake --build build

  build_gsm_engine:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: ~/project

      - run:
          name: Install system build deps for GSMEngine
          command: |
            sudo apt-get update
            sudo apt-get install -y cmake build-essential

      - run:
          name: Build GSMEngine by pip
          command: |
            cd GSMEngine
            python -m pip install -e .

  unit_tests:
    docker:
      - image: cimg/python:3.11
    working_directory: ~/project
    steps:
      - attach_workspace:
          at: ~/project

      - run:
          name: Install Python dependencies
          command: |
            python -m pip install --upgrade pip
            python -m pip install -r MonitoringManager/requirements_tests.txt

      - run:
          name: Run tests with JUnit output
          command: |
            mkdir -p test-results
            PYTHONPATH=. pytest MonitoringManager/tests -q --junitxml=test-results/junit.xml

      - run:
          name: Run tests with coverage
          command: |
            mkdir -p coverage-results
            PYTHONPATH=. pytest MonitoringManager/tests --cov=MonitoringManager --cov-report=term-missing --cov-report=xml:coverage-results/coverage.xml --cov-report=html:coverage-results/html

      - store_test_results:
          path: test-results

      - store_artifacts:
          path: test-results

      - store_artifacts:
          path: coverage-results

workflows:
  version: 2
  test_workflow:
    jobs:
      - prepare
      - build_gsm_app:
          requires:
            - prepare
      - build_gsm_engine:
          requires:
            - prepare
      - unit_tests:
          requires:
            - prepare
